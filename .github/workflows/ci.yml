name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Scorecard Token-Permissions: least privilege for GITHUB_TOKEN
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        # Pin by commit SHA (Scorecard Pinned-Dependencies)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run fixture unit tests
        run: pytest -v
        env:
          # Live PG tests skip without DSN; fixture suite must pass offline.
          MHTML_ETL_DSN: ""
