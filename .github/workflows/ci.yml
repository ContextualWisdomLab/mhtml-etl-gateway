name: Repository Quality

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches: [main, 'agent/**']
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install hash-locked test and runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: --require-hashes -r requirements-quality.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts
      - name: Run exact line and branch coverage
        env:
          PYTHONPATH: src
        run: |
          coverage erase
          coverage run --branch -m pytest -q
          coverage report --show-missing --fail-under=100
      - name: Validate repository contracts
        env:
          PYTHONPATH: src
        run: python scripts/validate_repository.py
      - name: Build wheel without runtime dependencies
        run: python -m pip wheel . --no-deps --wheel-dir dist
