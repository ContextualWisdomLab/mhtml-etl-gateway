name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Scorecard Token-Permissions: least privilege for GITHUB_TOKEN
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run fixture unit tests
        run: pytest -v
        env:
          # Live PG tests skip without DSN; fixture suite must pass offline.
          MHTML_ETL_DSN: ""
